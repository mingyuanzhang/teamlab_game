<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Wonders · Shapes with secrets</title>
<link rel="stylesheet" href="style.css?v=700dcbf00806">
</head>
<body>
<main>
  <canvas id="world" aria-label="A side-on world of little people. Place up to six copies of each mystery shape, or move existing copies. Draw paths, ladders, and bouncing lines for people to explore."></canvas>
  <header>
    <label class="music-theme" for="music-theme"><span aria-hidden="true">♫</span><span class="sr-only">Music theme</span><select id="music-theme" aria-label="Music theme" title="Music theme"><option value="default">Default</option><option value="brubeck">Brubeck</option><option value="metal">Metal</option><option value="sky">Sky Castle</option><option value="platformer">Platformer</option><option value="tchaikovsky">Tchaikovsky</option><option value="moonlight">Moonlight Ballad</option><option value="bounce">Bounce</option><option value="gaoshan">高山流水</option><option value="bach">Bach</option><option value="chopin">Chopin</option></select></label>
    <button id="sound" aria-pressed="false" aria-label="Mute sound" title="Mute music and discovery tunes · M"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-slash" d="m15 9 6 6m0-6-6 6"/></svg></button>
    <button id="pause" aria-pressed="false" aria-label="Pause animation" title="Pause · Space"><span aria-hidden="true">Ⅱ</span></button>
  </header>
  <aside class="drawing" aria-label="Drawing tools">
    <button data-tool="move" class="active" aria-pressed="true" aria-label="Move shapes (V)"><span>↖</span></button>
    <button data-tool="line" aria-pressed="false" aria-label="Draw a path (L)"><span>╱</span></button>
    <button data-tool="ladder" aria-pressed="false" aria-label="Draw a ladder (H)"><span>☷</span></button>
    <button data-tool="spring" aria-pressed="false" aria-label="Draw a bouncing line (B)"><span>⌁</span></button>
    <div class="rule"></div><button id="undo" aria-label="Undo last edit"><span>↶</span></button><button id="clear" aria-label="Reset the world"><span>⟳</span></button>
  </aside>
  <section class="dock" aria-label="Mystery shapes">
    <p id="status" class="sr-only" role="status">Six copies of each shape are available.</p>
    <div class="shapes">
      <button class="shape" data-shape="0" aria-label="Circle, shape 1" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="shape" data-shape="1" aria-label="Triangle, shape 2" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9 40 36 8 36Z"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="shape" data-shape="2" aria-label="Diamond, shape 3" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 7 14 17-14 17L10 24Z"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="shape" data-shape="3" aria-label="Square, shape 4" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="12" y="12" width="24" height="24" rx="2"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="shape" data-shape="4" aria-label="Hexagon, shape 5" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m16 10 16 0 8 14-8 14H16L8 24Z"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="shape" data-shape="5" aria-label="Crescent, shape 6" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M30 10a15 15 0 1 0 0 28 17 17 0 0 1 0-28Z"/></svg><span class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
    </div>
  </section>
</main>
<script src="simulation.js?v=219f71515052"></script><script src="vendor/wonder-audio/audio.js?v=a190414c6f3d"></script><script src="illustrations.js?v=046ead866ccc"></script><script src="world.js?v=8d7546099d61"></script>
</body>
</html>
